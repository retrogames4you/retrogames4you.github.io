<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Arcade player</title>
<link rel="stylesheet" href="vendor/js-dos/js-dos.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dos { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="dos"></div>
<script src="vendor/js-dos/js-dos.js"></script>
<script src="vendor/fflate/fflate.js"></script>
<script>
(() => {
  "use strict";
  // Each game runs in its own fresh frame; the arcade page sends what to run.
  const PATH_PREFIX = new URL("vendor/js-dos/emulators/", location.href).href;
  let started = false;

  // Small ZIP reader (also handles self-extracting .EXE archives with a DOS stub in front).
  function zipEntries(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return [];
    const count = dv.getUint16(eocd + 10, true), cdSize = dv.getUint32(eocd + 12, true), cdOff = dv.getUint32(eocd + 16, true);
    const shift = eocd - cdSize - cdOff;  // bytes in front of the zip data (SFX stub)
    let p = cdOff + shift;
    const out = [];
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true) + shift;
      let name = ""; for (let i = 0; i < nl; i++) name += String.fromCharCode(u8[p + 46 + i]);
      out.push({ name, flags, method, csize, usize, local });
      p += 46 + nl + xl + cl;
    }
    return out;
  }
  function zipData(u8, e) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const start = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
    const raw = u8.subarray(start, start + e.csize);
    if (e.method === 0) return raw.slice();
    if (e.method === 8) return fflate.inflateSync(raw);
    if (e.method === 6) return explode(raw, e.usize, e.flags);
    if (e.method === 1) return unshrink(raw, e.usize);
    throw new Error("Unsupported zip method " + e.method + " for " + e.name);
  }
// PKWARE "implode" (zip method 6) decoder. Mirrors Info-ZIP explode.c (inverted-bit Huffman decoding).
  function explode(src, usize, flags) {
    const big = (flags & 2) !== 0, lit = (flags & 4) !== 0;
    let pos = 0, bitbuf = 0, bitcnt = 0;
    const need = n => { while (bitcnt < n) { bitbuf |= (pos < src.length ? src[pos] : 0) << bitcnt; pos++; bitcnt += 8; } };
    const getbits = n => { need(n); const v = bitbuf & ((1 << n) - 1); bitbuf >>>= n; bitcnt -= n; return v; };
    function readLengths(n) {
      const count = src[pos++] + 1, lens = [];
      for (let i = 0; i < count; i++) { const b = src[pos++]; const len = (b & 15) + 1, rep = (b >> 4) + 1; for (let k = 0; k < rep; k++) lens.push(len); }
      if (lens.length !== n) throw new Error("bad tree " + lens.length + "/" + n);
      return lens;
    }
    function makeDecoder(lens) {
      // canonical codes (shortest first, by symbol), read MSB-first with every bit inverted
      const maxLen = Math.max(...lens), blCount = new Array(maxLen + 1).fill(0);
      lens.forEach(l => blCount[l]++);
      const next = new Array(maxLen + 2).fill(0); let code = 0;
      for (let b = 1; b <= maxLen; b++) { code = (code + blCount[b - 1]) << 1; next[b] = code; }
      const map = new Map();
      lens.forEach((l, s) => { map.set(l + ":" + next[l]++, s); });
      return () => { let c = 0; for (let l = 1; l <= maxLen; l++) { c = (c << 1) | (getbits(1) ^ 1); const s = map.get(l + ":" + c); if (s !== undefined) return s; } throw new Error("bad code"); };
    }
    const litDec = lit ? makeDecoder(readLengths(256)) : null;
    const lenDec = makeDecoder(readLengths(64));
    const distDec = makeDecoder(readLengths(64));
    const out = new Uint8Array(usize); let op = 0;
    const dbits = big ? 7 : 6, minLen = lit ? 3 : 2;
    while (op < usize) {
      if (getbits(1)) out[op++] = lit ? litDec() : getbits(8);
      else {
        const low = getbits(dbits); const dist = ((distDec() << dbits) | low) + 1;
        let len = lenDec(); if (len === 63) len += getbits(8); len += minLen;
        for (let i = 0; i < len && op < usize; i++, op++) out[op] = op - dist >= 0 ? out[op - dist] : 0;
      }
    }
    return out;
  }
  // PKWARE "shrink" (zip method 1): LZW with 9..13-bit codes and partial clearing.
  function unshrink(src, usize) {
    let pos = 0, bitbuf = 0, bitcnt = 0;
    const getbits = n => { while (bitcnt < n) { bitbuf |= (pos < src.length ? src[pos] : 0) << bitcnt; pos++; bitcnt += 8; } const v = bitbuf & ((1 << n) - 1); bitbuf >>>= n; bitcnt -= n; return v; };
    const MAX = 8192, parent = new Int32Array(MAX).fill(-1), value = new Uint8Array(MAX), used = new Uint8Array(MAX);
    for (let i = 0; i < 256; i++) { used[i] = 1; value[i] = i; }
    const out = new Uint8Array(usize); let op = 0, codesize = 9, next = 257;
    const stack = new Uint8Array(MAX);
    const firstOf = c => { while (parent[c] >= 0) c = parent[c]; return value[c]; };
    const emit = c => { let sp = 0; while (c >= 0) { stack[sp++] = value[c]; c = parent[c]; } while (sp && op < usize) out[op++] = stack[--sp]; };
    if (!usize) return out;
    let old = getbits(codesize); out[op++] = old;
    while (op < usize) {
      const code = getbits(codesize);
      if (code === 256) {
        const sub = getbits(codesize);
        if (sub === 1) codesize++;
        else if (sub === 2) {
          const isParent = new Uint8Array(MAX);
          for (let c = 257; c < MAX; c++) if (used[c] && parent[c] >= 257) isParent[parent[c]] = 1;
          for (let c = 257; c < MAX; c++) if (used[c] && !isParent[c]) { used[c] = 0; parent[c] = -1; }
          next = 257; while (next < MAX && used[next]) next++;
        }
        continue;
      }
      let fc;
      if (used[code]) { fc = firstOf(code); emit(code); }
      else { fc = firstOf(old); emit(old); if (op < usize) out[op++] = fc; }
      if (next < MAX) {
        parent[next] = old; value[next] = fc; used[next] = 1;
        while (next < MAX && used[next]) next++;
      }
      old = code;
    }
    return out;
  }
  function zipExtract(u8, name) {
    const e = zipEntries(u8).find(x => x.name.toLowerCase() === name.toLowerCase());
    return e ? zipData(u8, e) : null;
  }
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || started) return;
    const d = e.data || {};
    if (d.type !== "run") return;
    started = true;
    const opts = { pathPrefix: PATH_PREFIX, autoStart: true, kiosk: true, noCloud: true,
                   backend: "dosbox", backendLocked: true, theme: "dark" };
    if (d.url) opts.url = new URL(d.url, location.href).href;
    else {
      const archive = new Uint8Array(d.bytes);
      opts.initFs = [archive];
      // Archives packed with methods DOSBox can't read (e.g. 1988 "implode"): unpack them here instead.
      // With settings files we unpack here too, so those files reliably replace the originals they update.
      if (d.extractAll || (Array.isArray(d.files) && d.files.length)) {
        opts.initFs = [];
        for (const e of zipEntries(archive)) {
          if (e.name.endsWith("/")) continue;
          try { opts.initFs.push({ path: e.name, contents: zipData(archive, e) }); }
          catch (err) { console.warn("skipped", e.name, err.message); }
        }
      }
      // Optional: unpack a self-extracting installer from the original archive here in the
      // browser (what the game's own installer would do), e.g. One Must Fall's OMF21.EXE.
      if (Array.isArray(d.unpack)) {
        for (const u of d.unpack) {
          // "from" may list several pieces that together form one archive (e.g. Heretic's HTIC_V12.1 + .2).
          const pieces = [].concat(u.from).map(n => zipExtract(archive, n));
          let inner = pieces[0];
          if (pieces.length > 1 && pieces.every(Boolean)) {
            inner = new Uint8Array(pieces.reduce((a, b) => a + b.length, 0));
            let o = 0; for (const b of pieces) { inner.set(b, o); o += b.length; }
          }
          if (!inner) continue;
          for (const e of zipEntries(inner)) {
            if (e.name.endsWith("/")) continue;
            opts.initFs.push({ path: (u.to ? u.to + "/" : "") + e.name, contents: zipData(inner, e) });
          }
        }
      }
      // Optional small settings files, i.e. what the game's own setup program would have saved.
      if (Array.isArray(d.files)) for (const f of d.files) {
        opts.initFs = opts.initFs.filter(x => !(x.path && x.path.toUpperCase() === f.path.toUpperCase()));
        opts.initFs.push({ path: f.path, contents: f.b64 ? Uint8Array.from(atob(f.b64), c => c.charCodeAt(0)) : new TextEncoder().encode(f.text) });
      }
      if (d.conf) opts.dosboxConf = d.conf;
    }
    // Optional scripted key presses, e.g. to accept an original installer's defaults.
    opts.onEvent = (event, ci) => {
      if (event !== "ci-ready") return;
      window.__ci = ci;
      if (Array.isArray(d.keys) && d.keys.length) {
        let t = 0;
        d.keys.forEach(k => {
          t += k.wait || 0;
          if (k.text) {  // type a command line, e.g. after an installer drops back to the prompt
            for (const ch of k.text.toUpperCase()) { const c = ch === " " ? 32 : ch === "\\" ? 92 : ch === "." ? 46 : ch.charCodeAt(0); setTimeout(() => ci.simulateKeyPress(c), t); t += 120; }
          } else if (k.hold) {  // some menus only notice a key that stays down a little longer
            setTimeout(() => ci.sendKeyEvent(k.key, true), t); setTimeout(() => ci.sendKeyEvent(k.key, false), t + k.hold);
          } else setTimeout(() => ci.simulateKeyPress(...[].concat(k.key)), t);
        });
      }
    };
    Dos(document.getElementById("dos"), opts);
    window.focus();
  });
  parent.postMessage({ type: "player-ready" }, location.origin);
})();
</script>
</body>
</html>
