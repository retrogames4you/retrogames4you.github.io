<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retro Arcade – ScummVM</title>
<!-- ScummVM (GPL-2.0-or-later), web build. See LICENSE-ScummVM.txt and NOTICE.txt in this folder. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* the canvas must not have a border or padding, or mouse coordinates will be wrong */
  canvas.emscripten { border: 0 none; position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  #download-modal { display: none; position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
    width: 380px; max-width: 90%; z-index: 10; overflow: hidden; border-radius: 10px;
    background: #221E3B; color: #ECE9FF; border: 1px solid #352F5C; font: 14px/1.4 system-ui, sans-serif; }
  #download-modal-title { margin: 0; padding: 10px 16px; background: #1B1830; border-bottom: 1px solid #352F5C; text-align: center; }
  #download-modal-title h3 { margin: 0; font-size: 14px; }
  #download-modal-content { padding: 12px 16px; }
  #download-modal-progress { height: 14px; border-radius: 7px; background: #12101F; overflow: hidden; margin: 6px 0 10px; }
  #download-modal-progress-fill { height: 100%; width: 0%; background: #FFB000; }
  #download-modal p { margin: 4px 0; font-size: 12px; color: #B3ACDA; }
</style>
</head>
<body>
  <div id="download-modal">
    <div id="download-modal-title"><h3></h3></div>
    <div id="download-modal-content">
      <div id="download-modal-progress"><div id="download-modal-progress-fill"></div></div>
      <p id="download-modal-progress-text"></p>
      <p id="download-modal-speed-text"></p>
    </div>
  </div>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    // Launch arguments come from the hash, e.g. #--path=/data/games/sky sky (read by the ScummVM web build).
    var Module = {
      preRun: [], postRun: [],
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      canvas: document.getElementById("canvas"),
      setStatus: function (text) {
        const m = document.getElementById("download-modal");
        if (text === Module.setStatus.last) return;
        Module.setStatus.last = text;
        if (text) { m.style.display = "block"; document.getElementById("download-modal-title").firstChild.textContent = text; }
        else {
          m.style.display = "none";
          const f = document.getElementById("download-modal-progress-fill");
          f.style.transition = "none"; f.style.width = "0%";
        }
      },
      onRuntimeInitialized: function () { if (typeof httpHideProgressBar === "function") httpHideProgressBar(); },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? "Laden… (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
      }
    };
    Module.setStatus.last = null;
    Module.setStatus("ScummVM laden…");
    document.getElementById("canvas").addEventListener("webglcontextlost", e => e.preventDefault(), false);
  </script>
  <script async src="scummvm.js"></script>
</body>
</html>
